<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" width="640" height="196" role="img" aria-label="FraudGuard project card"><title>FraudGuard project card</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1530"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DE2E6"/><stop offset="1" stop-color="#8B7BFF"/></linearGradient></defs><style>text{font-family:'Segoe UI Variable Display','SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}</style><rect width="640" height="196" rx="20" fill="url(#bg)"/><rect x=".5" y=".5" width="639" height="195" rx="19.5" fill="none" stroke="#24305A"/><rect x="28" y="28" width="212" height="140" rx="14" fill="#121A33" stroke="#24305A"/><line x1="36" y1="86" x2="232" y2="86" stroke="#FF5C7A" stroke-opacity=".7" stroke-dasharray="4 4"/><path d="M36,136 L58,122 L80,130 L102,104 L124,114 L146,88 L168,106 L190,58 L212,100 L234,78" fill="none" stroke="url(#ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" from="420" to="0" dur="1.6s" fill="freeze"/></path><circle cx="190" cy="58" r="3.2" fill="#FF5C7A"/><circle cx="190" cy="58" r="3.2" fill="none" stroke="#FF5C7A" stroke-width="1.5"><animate attributeName="r" values="3.2;10.2;10.2" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="234" cy="78" r="3.2" fill="#FF5C7A"/><circle cx="234" cy="78" r="3.2" fill="none" stroke="#FF5C7A" stroke-width="1.5"><animate attributeName="r" values="3.2;10.2;10.2" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;0" dur="2.4s" repeatCount="indefinite"/></circle><text x="36" y="160" font-size="10" fill=