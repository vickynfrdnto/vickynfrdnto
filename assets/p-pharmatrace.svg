<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-label="PharmaTrace AI project card"><title>PharmaTrace AI project card</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1530"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DE2E6"/><stop offset="1" stop-color="#8B7BFF"/></linearGradient></defs><style>text{font-family:'Segoe UI Variable Display','SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}</style><rect width="640" height="262" rx="20" fill="url(#bg)"/><rect x=".5" y=".5" width="639" height="261" rx="19.5" fill="none" stroke="#24305A"/><text x="28" y="54" font-size="26" fill="#EAF0FF" font-weight="800" text-anchor="start" letter-spacing="-.5">PharmaTrace AI</text><text x="28" y="84" font-size="13.5" fill="#C9D3F5" font-weight="400" text-anchor="start" >Audits medicine and device claims against procurement</text><text x="28" y="103" font-size="13.5" fill="#C9D3F5" font-weight="400" text-anchor="start" >and medical-record activity, then ranks the mismatches</text><text x="28" y="122" font-size="13.5" fill="#C9D3F5" font-weight="400" text-anchor="start" >a human should review before payment.</text><circle cx="34" cy="152" r="3.2" fill="#2DE2E6"/><text x="46" y="156" font-size="12.5" fill="#C9D3F5" font-weight="500" text-anchor="start" >Rules plus IsolationForest, 90.1% recall on synthetic data</text><circle cx="34" cy="174" r="3.2" fill="#8B7BFF"/><text x="46" y="178" font-size="12.5" fill="#C9D3F5" font-weight="500" text-anchor="start" >React, Vite, FastAPI, SHAP, 3D scene in React Three Fiber</text><circle cx="34" cy="196" r="3.2" fill="#FFB86B"/><text x="46" y="200" font-size="12.5" fill="#C9D3F5" font-weight="500" text-anchor="start" >Made for .id DeveloperDay 2026, Health and Wellbeing track</text><text x="28" y="240" font-size="11" fill="#8E9BC7" font-weight="400" text-anchor="start" >Synthetic data only. A prototype, not a production claims system.</text><rect x="430" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.38"/><rect x="457" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.43"/><rect x="484" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.46"/><rect x="511" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.52"/><rect x="538" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.43"/><rect x="565" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.52"/><rect x="592" y="50" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.11"/><rect x="430" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.31"/><rect x="457" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.52"/><rect x="484" y="77" width="22" height="22" rx="5" fill="#FF5C7A"><animate attributeName="opacity" values=".45;1;.45" dur="2.0s" repeatCount="indefinite"/></rect><rect x="511" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.39"/><rect x="538" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.51"/><rect x="565" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.15"/><rect x="592" y="77" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.31"/><rect x="430" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.21"/><rect x="457" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.34"/><rect x="484" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.36"/><rect x="511" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.11"/><rect x="538" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.20"/><rect x="565" y="104" width="22" height="22" rx="5" fill="#8B7BFF" fill-opacity="0.23"/><rec